name: "Required CI"

# Invoked DIRECTLY by GitHub, through the organization ruleset rule
# "Require workflows to pass before merging":
#
#   repository_id: 653703736             (webinertia/.github)
#   path:          .github/workflows/org-required-ci.yml
#   ref:           master
#
# It lives here rather than in webware-tools because webware-tools is a
# released package: its N.N.x branches are release lines, and making one of
# them the control plane for every repository's CI couples package releases to
# org governance. This repository is org config and is never published.
#
# GitHub triggers this file itself, so per-repository variation cannot arrive
# as `with:` inputs the way it does for a consumer's `uses:` call. It is read
# at runtime from `webware-ci.json` in the target repository's root -- beside
# the other tool config (mago.toml, phpunit.xml.dist, infection.json5.dist) --
# a file that carries values only and NO workflow ref, so it cannot drift.

on:
  pull_request:
    branches:
      - "[0-9]+.[0-9]+.x"

permissions:
  contents: read

jobs:
  config:
    name: "Read webware-ci.json"
    runs-on: ubuntu-latest
    outputs:
      php_versions: ${{ steps.read.outputs.php_versions }}
      run_integration: ${{ steps.read.outputs.run_integration }}
      integration_php_version: ${{ steps.read.outputs.integration_php_version }}
      composer_options: ${{ steps.read.outputs.composer_options }}
      db_image: ${{ steps.read.outputs.db_image }}
      db_env_json: ${{ steps.read.outputs.db_env_json }}
      db_port: ${{ steps.read.outputs.db_port }}
      db_health_cmd: ${{ steps.read.outputs.db_health_cmd }}
      db_health_retries: ${{ steps.read.outputs.db_health_retries }}
      db_health_interval_seconds: ${{ steps.read.outputs.db_health_interval_seconds }}
      enable_codecov: ${{ steps.read.outputs.enable_codecov }}
      enable_infection: ${{ steps.read.outputs.enable_infection }}
      coverage_php_version: ${{ steps.read.outputs.coverage_php_version }}
      min_msi: ${{ steps.read.outputs.min_msi }}
      min_covered_msi: ${{ steps.read.outputs.min_covered_msi }}
      test_env_json: ${{ steps.read.outputs.test_env_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read config
        id: read
        run: |
          set -euo pipefail
          # Root is the canonical location, beside mago.toml and the other tool
          # config in these repositories.
          file=webware-ci.json
          if [ ! -f "$file" ]; then
            echo "::error::webware-ci.json not found in the repository root."
            echo "::error::Repositories targeted by the org required-workflow ruleset must provide one. See webinertia/.github."
            exit 1
          fi
          {
            echo "php_versions=$(jq -c '.php_versions // ["8.4", "8.5"]' "$file")"
            echo "run_integration=$(jq -r '.run_integration // false' "$file")"
            echo "integration_php_version=$(jq -r '.integration_php_version // ""' "$file")"
            echo "composer_options=$(jq -r '.composer_options // ""' "$file")"
            echo "db_image=$(jq -r '.db_image // ""' "$file")"
            echo "db_env_json=$(jq -c '.db_env_json // {}' "$file")"
            echo "db_port=$(jq -r '.db_port // ""' "$file")"
            echo "db_health_cmd=$(jq -r '.db_health_cmd // ""' "$file")"
            echo "db_health_retries=$(jq -r '.db_health_retries // 30' "$file")"
            echo "db_health_interval_seconds=$(jq -r '.db_health_interval_seconds // 2' "$file")"
            echo "enable_codecov=$(jq -r '.enable_codecov // false' "$file")"
            echo "enable_infection=$(jq -r '.enable_infection // false' "$file")"
            echo "coverage_php_version=$(jq -r '.coverage_php_version // ""' "$file")"
            echo "min_msi=$(jq -r '.min_msi // "10"' "$file")"
            echo "min_covered_msi=$(jq -r '.min_covered_msi // "10"' "$file")"
            echo "test_env_json=$(jq -c '.test_env_json // {}' "$file")"
          } >> "$GITHUB_OUTPUT"

      # The Mago version has exactly ONE home: the `version =` pin in
      # webinertia/webware-tools/mago.toml, resolved at run time by the mago and
      # mutation-test jobs and by each repository's tooling container. A literal
      # anywhere else re-introduces the drift this workflow exists to prevent,
      # so it fails the build instead of passing silently.
      - name: Reject duplicated Mago version pins
        if: github.repository != 'webinertia/webware-tools'
        run: |
          set -euo pipefail
          failed=0

          scan() {
            description="$1"
            shift
            if found=$(grep -rInE "$@" --exclude-dir=vendor --exclude-dir=.git . 2>/dev/null); then
              printf '::error::%s\n' "$description"
              printf '%s\n' "$found"
              failed=1
            fi
          }

          scan 'Dockerfile pins Mago with a literal build arg; it is derived from the webware-tools pin.' --include=Dockerfile '^ARG[[:space:]]+MAGO_VERSION[[:space:]]*='
          scan 'compose.yml passes a literal Mago build arg; the Dockerfile derives it.' --include='compose*.yml' --include='compose*.yaml' '^[[:space:]]*MAGO_VERSION[[:space:]]*:'
          scan 'A workflow installs a literal Mago version.' --include='*.yml' --include='*.yaml' 'tools:[[:space:]]*mago:[0-9]'
          scan 'mago.toml restates the Mago version pin; it is inherited from webware/webware-tools.' --include='mago.toml' '^[[:space:]]*version[[:space:]]*=[[:space:]]*"'
          scan 'mago.toml pins the editor schema to a Mago version; use the unpinned URL.' --include='mago.toml' '#:schema.*mago\.carthage\.software/[0-9]'

          exit "$failed"

  mago:
    name: "Mago (PHP ${{ matrix.php }})"
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.config.outputs.php_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # setup-php declares no cache input; caching is done with actions/cache
      # over composer's own cache directory, as its README documents.
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress ${{ needs.config.outputs.composer_options }}

      # Overrides php-version from the repository's mago.toml for each matrix
      # leg without mutating the committed config file.
      # Mago is NOT pinned in this workflow. Its version is read from the
      # webware-tools mago.toml that composer actually installed, so the binary
      # always matches the `version =` pin that mago itself enforces. That pin
      # has exactly one home: webinertia/webware-tools/mago.toml.
      - name: Resolve Mago version
        id: mago-version
        run: |
          set -euo pipefail
          pin=vendor/webware/webware-tools/mago.toml
          if [ ! -f "$pin" ]; then
            echo "::error::$pin not found. Did composer install resolve webware/webware-tools?"
            exit 1
          fi
          version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$pin" | head -n1)
          if [ -z "$version" ]; then
            echo "::error::No 'version = \"x.y.z\"' pin found in $pin."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Mago ${{ steps.mago-version.outputs.version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: mago:${{ steps.mago-version.outputs.version }}

      - name: Pin Mago PHP version
        run: echo "MAGO_PHP_VERSION=${{ matrix.php }}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: mago format --check

      - name: Lint
        if: success() || failure()
        run: mago lint

      - name: Analyze
        if: success() || failure()
        run: mago analyze

      - name: Guard
        if: success() || failure()
        run: mago guard

  test:
    name: "Test (PHP ${{ matrix.php }} | ${{ matrix.dependencies }})"
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.config.outputs.php_versions) }}
        dependencies: ["lowest", "locked", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ (matrix.php == needs.config.outputs.coverage_php_version && matrix.dependencies == 'locked') && 'pcov' || 'none' }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-

      # The DB is a manual step, not a native `services:` block, because
      # `services:` cannot be conditionally omitted and driver packages need
      # different engines (mysql, postgres, mariadb, oracle, mssql, ...).
      # A repository with no DB simply omits `db_image`, so both steps skip.
      #
      # Pulling and booting the DB costs ~20-25s per leg, which dominates a
      # test leg, so it only starts where the integration suite will run.
      # `integration_php_version` narrows that to a single leg; empty keeps
      # the original behaviour of running integration on every leg.
      - name: Start DB service
        if: needs.config.outputs.db_image != '' && fromJSON(needs.config.outputs.run_integration) && (needs.config.outputs.integration_php_version == '' || matrix.php == needs.config.outputs.integration_php_version)
        run: |
          docker run -d --name db \
            -p ${{ needs.config.outputs.db_port }}:${{ needs.config.outputs.db_port }} \
            $(echo '${{ needs.config.outputs.db_env_json }}' | jq -r 'to_entries[] | "-e \(.key)=\(.value)"' | tr '\n' ' ') \
            ${{ needs.config.outputs.db_image }}

      - name: Wait for DB to be healthy
        if: needs.config.outputs.db_image != '' && fromJSON(needs.config.outputs.run_integration) && (needs.config.outputs.integration_php_version == '' || matrix.php == needs.config.outputs.integration_php_version)
        run: |
          for i in $(seq 1 ${{ fromJSON(needs.config.outputs.db_health_retries) }}); do
            docker exec db ${{ needs.config.outputs.db_health_cmd }} && exit 0
            sleep ${{ fromJSON(needs.config.outputs.db_health_interval_seconds) }}
          done
          echo "DB did not become healthy in time" && exit 1

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --no-interaction --no-progress ${{ needs.config.outputs.composer_options }}

      - name: Install dependencies (locked)
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --no-progress ${{ needs.config.outputs.composer_options }}

      - name: Install dependencies (latest)
        if: matrix.dependencies == 'latest'
        run: composer update --no-interaction --no-progress ${{ needs.config.outputs.composer_options }}

      # PHPUnit's <env> will not override an already-set real env var (no
      # force="true"), so this lets a repository override a connection setting
      # for CI without editing phpunit.xml.dist, which needs different values
      # for local dev (e.g. Docker Compose networking).
      - name: Export test environment overrides
        if: needs.config.outputs.test_env_json != '{}'
        run: echo '${{ needs.config.outputs.test_env_json }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Unit tests
        if: ${{ !(matrix.php == needs.config.outputs.coverage_php_version && matrix.dependencies == 'locked') }}
        run: composer test

      - name: Unit tests with coverage
        if: matrix.php == needs.config.outputs.coverage_php_version && matrix.dependencies == 'locked'
        run: composer test-coverage

      - name: Integration tests
        if: fromJSON(needs.config.outputs.run_integration) && (needs.config.outputs.integration_php_version == '' || matrix.php == needs.config.outputs.integration_php_version)
        run: composer test-integration

      - name: Upload coverage artifact
        if: matrix.php == needs.config.outputs.coverage_php_version && matrix.dependencies == 'locked'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-clover
          path: clover.xml

  codecov:
    name: "Codecov"
    needs: [config, test]
    if: fromJSON(needs.config.outputs.enable_codecov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage-clover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # CODECOV_TOKEN is an org-wide upload token, which cannot infer the
          # target repository the way a repository-specific token can.
          # `github.repository` resolves to the target repository here.
          slug: ${{ github.repository }}
          files: clover.xml
          # Report-only across the fleet; do not fail CI on upload issues.
          fail_ci_if_error: false

  mutation-test:
    name: "Mutation testing"
    needs: [config, test]
    if: fromJSON(needs.config.outputs.enable_infection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.config.outputs.coverage_php_version }}
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ needs.config.outputs.coverage_php_version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ needs.config.outputs.coverage_php_version }}-

      - name: Start DB service
        if: needs.config.outputs.db_image != '' && fromJSON(needs.config.outputs.run_integration)
        run: |
          docker run -d --name db \
            -p ${{ needs.config.outputs.db_port }}:${{ needs.config.outputs.db_port }} \
            $(echo '${{ needs.config.outputs.db_env_json }}' | jq -r 'to_entries[] | "-e \(.key)=\(.value)"' | tr '\n' ' ') \
            ${{ needs.config.outputs.db_image }}

      - name: Wait for DB to be healthy
        if: needs.config.outputs.db_image != '' && fromJSON(needs.config.outputs.run_integration)
        run: |
          for i in $(seq 1 ${{ fromJSON(needs.config.outputs.db_health_retries) }}); do
            docker exec db ${{ needs.config.outputs.db_health_cmd }} && exit 0
            sleep ${{ fromJSON(needs.config.outputs.db_health_interval_seconds) }}
          done
          echo "DB did not become healthy in time" && exit 1

      - name: Install dependencies
        run: composer install --no-interaction --no-progress ${{ needs.config.outputs.composer_options }}

      # Mago is NOT pinned in this workflow either; see the mago job for the
      # rationale. The version comes from the installed webware-tools pin.
      - name: Resolve Mago version
        id: mago-version
        run: |
          set -euo pipefail
          pin=vendor/webware/webware-tools/mago.toml
          if [ ! -f "$pin" ]; then
            echo "::error::$pin not found. Did composer install resolve webware/webware-tools?"
            exit 1
          fi
          version=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' "$pin" | head -n1)
          if [ -z "$version" ]; then
            echo "::error::No 'version = \"x.y.z\"' pin found in $pin."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Mago ${{ steps.mago-version.outputs.version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.config.outputs.coverage_php_version }}
          coverage: pcov
          tools: mago:${{ steps.mago-version.outputs.version }}

      - name: Export test environment overrides
        if: needs.config.outputs.test_env_json != '{}'
        run: echo '${{ needs.config.outputs.test_env_json }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Pin Mago PHP version
        run: echo "MAGO_PHP_VERSION=${{ needs.config.outputs.coverage_php_version }}" >> "$GITHUB_ENV"

      # Mago is invoked internally by Infection (staticAnalysisTool in
      # infection.json5), not by this workflow directly -- no needs:[mago] here.
      - name: Mutation testing
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
        run: composer mutation-test -- --min-msi=${{ needs.config.outputs.min_msi }} --min-covered-msi=${{ needs.config.outputs.min_covered_msi }} --logger-github
