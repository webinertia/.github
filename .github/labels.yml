# Org-wide canonical label set for the webinertia organisation.
#
# Every label the org-wide configuration references MUST exist here, otherwise the
# reference silently no-ops in any repository that does not already have the label:
#   .github/ISSUE_TEMPLATE/bug_report.yml -> status: Not Confirmed
#   .github/ISSUE_TEMPLATE/rfc.yml        -> RFC
#   renovate-config.json                  -> renovate, security,
#                                            Awaiting Maintainer Response
#
# Naming: plain names for type/workflow labels; colon prefixes for the
# priority:, status:, needs:, blocked:, version: and db: families.
# Colours are grouped by family - reuse across families is intentional.

# --- GitHub defaults ---
- color: "d73a4a"
  name: "bug"
  description: "Something isn't working"
- color: "0075ca"
  name: "documentation"
  description: "Improvements or additions to documentation"
- color: "cfd3d7"
  name: "duplicate"
  description: "This issue or pull request already exists"
- color: "a2eeef"
  name: "enhancement"
  description: "New feature or request"
- color: "7057ff"
  name: "good first issue"
  description: "Good for newcomers"
- color: "008672"
  name: "help wanted"
  description: "Extra attention is needed"
- color: "e4e669"
  name: "invalid"
  description: "This doesn't seem right"
- color: "d876e3"
  name: "question"
  description: "Further information is requested"
- color: "ffffff"
  name: "wontfix"
  description: "This will not be worked on"

# --- Workflow / process ---
- color: "1d76db"
  name: "merge-up"
  description: "Must be merged up to the next minor/major branch after landing"
- color: "d93f0b"
  name: "breaking change"
  description: "Backwards-incompatible; targets the next major branch"
- color: "5319e7"
  name: "blocked: upstream release"
  description: "Blocked until an upstream component is tagged/released"
- color: "b60205"
  name: "wrong target branch"
  description: "PR does not target the branch required by the branching strategy"
- color: "d4c5f9"
  name: "needs: issue"
  description: "PR has no linked issue"
- color: "d4c5f9"
  name: "needs: tests"
  description: "PR is missing tests"
- color: "d4c5f9"
  name: "needs: docs"
  description: "PR is missing a documentation update"
- color: "bfd4f2"
  name: "RFC"
  description: "RFC issue or pull request"
- color: "b60205"
  name: "ims-migration"
  description: "Package moving out of the inventory-management-system application"
- color: "bfdadc"
  name: "tooling-alignment"
  description: "Tooling alignment with webware-tools reusable workflow"

